<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kopi Kenangan - Pesan Kopi & Makanan Favoritmu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sage: {
                50: "#f4f7f4",
                100: "#e3eae3",
                500: "#7A9A7A",
                600: "#5F7A5F",
                700: "#4A5F4A",
              },
              terracotta: {
                500: "#D97757",
                600: "#B85E40",
              },
            },
          },
        },
      };
    </script>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="bg-sage-50 text-stone-800 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-sage-500 selection:text-white"
    spellcheck="false"
  >
    <!-- Navbar -->
    <header
      class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-sage-100 shadow-sm"
    >
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-full bg-sage-600 flex items-center justify-center text-white font-bold text-xl shadow-md"
          >
            ☕
          </div>
          <span
            class="text-xl font-bold tracking-tight text-stone-900 font-['Poppins']"
            >Kopi Kenangan</span
          >
        </div>
        <!-- Navigasi Desktop & Mobile akan di-generate via script atau HTML statis -->
        <nav
          class="hidden md:flex items-center gap-8 font-medium text-stone-600"
        >
          <a href="#beranda" class="hover:text-sage-600 transition">Beranda</a>
          <a href="#shop" class="hover:text-sage-600 transition">Shop</a>
          <a href="#tentang" class="hover:text-sage-600 transition"
            >Tentang Kami</a
          >
          <a href="#stock" class="hover:text-sage-600 transition"
            >Stock Barang</a
          >
        </nav>
        <div class="flex items-center gap-4">
          <button
            id="cartBtn"
            class="relative p-2.5 rounded-full bg-sage-100 hover:bg-sage-200 text-stone-700 transition"
          >
            🛒
            <span
              id="cartBadge"
              class="absolute -top-1 -right-1 bg-terracotta-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold"
              >0</span
            >
          </button>
        </div>
      </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <section id="beranda" class="text-center py-12">
        <h1
          class="text-4xl font-extrabold text-stone-900 mb-4 font-['Poppins']"
        >
          Belanja Kebutuhan Kopi Jadi Lebih Mudah
        </h1>
        <p class="text-stone-600 max-w-2xl mx-auto mb-8">
          Nikmati varian kopi mix buah, taro, coklat, serta roti dan camilan
          lezat langsung dari genggaman Anda.
        </p>
      </section>

      <div
        id="productContainer"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
      >
        <!-- Produk akan dimuat dinamis oleh script.js -->
      </div>
    </main>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
